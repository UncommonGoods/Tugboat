# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]
junit-jupiter = "5.11.1"
easypost-java = "8.7.0"
jedis = "6.0.0"
testcontainers = "1.21.4"
gson = "2.13.1"
pdfbox = "3.0.3"
slf4j = "2.0.9"
javafx = "26.0.2"
atlantafx = "2.1.0"
ikonli = "12.4.0"
jserialcomm = "2.11.2"

# The Micronaut BOM/platform version, consumed by `micronaut { version(...) }`
# in :tugboat-xo rather than by a dependency alias.
micronaut = "4.9.2"

# Plugin versions live under a plugin- prefix so none of them is a prefix of a
# library version above: `micronaut-plugin` would turn `libs.versions.micronaut`
# into a node rather than the version accessor :tugboat-xo reads.
plugin-test-logger = "4.0.0"
plugin-shadow = "8.3.7"
plugin-micronaut = "4.5.4"
plugin-javafx = "0.1.0"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
easypost-java = { module = "com.easypost:easypost-api-client", version.ref = "easypost-java" }
jedis = { module = "redis.clients:jedis", version.ref = "jedis" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-core = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }

gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

javafx-controls = { module = "org.openjfx:javafx-controls", version.ref = "javafx" }
javafx-fxml = { module = "org.openjfx:javafx-fxml", version.ref = "javafx" }
atlantafx-base = { module = "io.github.mkpaz:atlantafx-base", version.ref = "atlantafx" }
ikonli-javafx = { module = "org.kordamp.ikonli:ikonli-javafx", version.ref = "ikonli" }
ikonli-materialdesign2 = { module = "org.kordamp.ikonli:ikonli-materialdesign2-pack", version.ref = "ikonli" }
jserialcomm = { module = "com.fazecast:jSerialComm", version.ref = "jserialcomm" }

# no versions so Micronaut BOM stays in charge
micronaut-http-validation = { module = "io.micronaut:micronaut-http-validation" }
slf4j-simple-managed = { module = "org.slf4j:slf4j-simple" }
micronaut-http-client-jdk = { module = "io.micronaut:micronaut-http-client-jdk" }
micronaut-management = { module = "io.micronaut:micronaut-management" }
micronaut-jms-sqs = { module = "io.micronaut.jms:micronaut-jms-sqs" }
micronaut-serde-jackson = { module = "io.micronaut.serde:micronaut-serde-jackson" }
micronaut-serde-processor = { module = "io.micronaut.serde:micronaut-serde-processor" }
micronaut-servlet-processor = { module = "io.micronaut.servlet:micronaut-servlet-processor" }
jul-to-slf4j = { module = "org.slf4j:jul-to-slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic" }
snakeyaml = { module = "org.yaml:snakeyaml" }

[bundles]
testcontainers = ["testcontainers-junit-jupiter", "testcontainers-core"]
javafx = ["javafx-controls", "javafx-fxml"]
ikonli = ["ikonli-javafx", "ikonli-materialdesign2"]

[plugins]
test-logger = { id = "com.adarshr.test-logger", version.ref = "plugin-test-logger" }
shadow = { id = "com.gradleup.shadow", version.ref = "plugin-shadow" }
micronaut-application = { id = "io.micronaut.application", version.ref = "plugin-micronaut" }
micronaut-aot = { id = "io.micronaut.aot", version.ref = "plugin-micronaut" }
javafx = { id = "org.openjfx.javafxplugin", version.ref = "plugin-javafx" }
